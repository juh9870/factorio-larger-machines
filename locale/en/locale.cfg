[string-mod-setting]
larger-machines-science-overlay-mode-scale=Scale icons
larger-machines-science-overlay-mode-extend=Extend grid

[string-mod-setting-description]
larger-machines-science-overlay-mode-scale=Science pack icons will scale in size with the machine (Recommended for runs with a relatively low amount of science packs)
larger-machines-science-overlay-mode-extend=Science pack icons will remain the same size, instead allowing more packs to fit onto the lab (Recommended for runs with a lot of science packs)

